name: fdfi-replication
channels:
  - conda-forge
dependencies:
  # ===== Python =====
  - python=3.10.19
  - pip

  - pip:
      # ===== FDFI 0.2.1 (bundled source, identical to PyPI release) =====
      - ./fdfi-0.2.1.tar.gz

      # ===== FDFI core dependencies =====
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.9
      - statsmodels==0.14.6

      # ===== FDFI flow dependencies ([flow] extra) =====
      - torch==2.13.0
      - torchdiffeq==0.2.5
      - tqdm==4.70.0

      # ===== Case-study data =====
      - pandas==2.3.3
      - xlrd==2.0.2            # reads CTG.xls (local or downloaded)